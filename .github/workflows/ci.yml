name: Windows checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    env:
      RUSTFLAGS: '-C target-feature=+crt-static'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # Seed the same static-CRT dependency cache consumed by releases.
          shared-key: windows-x64-static-v1
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Format
        run: cargo fmt --all -- --check
      - name: Fetch and verify driver without starting it
        run: ./scripts/fetch-driver.ps1
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests (local sockets, no interception)
        run: cargo test --locked
      - name: Verify DLL ABI and filters without opening driver
        run: cargo test --locked --test driver_abi -- --ignored
      - name: Build native release
        run: cargo build --locked --release
